 h+='<div class="lbb2">'+(LBO.btn?'<button data-l="go">'+esc(LBO.btn)+'</button>':'')+'<button data-l="x">إغلاق</button></div>';
 p.innerHTML=h;
 p.onclick=async e=>{const a=e.target.dataset&&e.target.dataset.l;if(!a)return;
  if(a==='x')p.style.display='none';
  else if(a==='go'){p.style.display='none';if(LBO.cb)LBO.cb()}
  else if(a==='out'){BK.token=null;BK.me=null;lsset('rte_token','');showBoard(LBO)}
  else if(a==='name'||a==='nick'){const v=($('lnm').value||'').trim();
   if(a==='nick'){if(v.length<2)return;lsset('rte_nick',v.slice(0,20));if(m==='claude')await submitScore(!!G.final);showBoard(LBO)}
   else{const r=await api('/api/profile',{name:v});if(r&&r.user){BK.me=r.user;showBoard(LBO)}else $('lerr').textContent=(r&&r.error)||'تعذّر الحفظ'}}
  else if(a==='dev'){const r=await api('/api/dev-login',{name:($('ldn').value||'').trim()});
   if(r&&r.token){BK.token=r.token;lsset('rte_token',r.token);BK.me=r.user;if(Math.floor(G.score)>0)await submitScore(!!G.final);showBoard(LBO)}else $('lerr').textContent=(r&&r.error)||'فشل الدخول'}};
 if(m==='server'&&!BK.token&&BK.cfg&&BK.cfg.clientId){try{await loadGIS();google.accounts.id.initialize({client_id:BK.cfg.clientId,callback:onGoogle});google.accounts.id.renderButton($('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',locale:'ar'})}catch(e){const er=$('lerr');if(er)er.textContent='تعذّر تحميل زر قوقل (تحقق من الاتصال)'}}}
function gameEnd(final,cb){submitScore(final).then(()=>showBoard({title:final?'🏁 النهاية — المتصدرون':'💔 انتهت المحاولات — المتصدرون',sub:'نقاطك: '+Math.floor(G.score),btn:final?'العب من جديد':(CP>0?'العودة لآخر نقطة حفظ':'حاول من جديد'),cb}))}
$('lbb').onclick=()=>{if(G.run||CIN.on)return;showBoard({title:'🏆 المتصدرون والحساب'})};
addEventListener('resize',resize);resize();
G={z:0,score:0,lives:3,done:0,px:SHIP.x+6,pz:SHIP.z,tx:0,tz:0,ox:100,en:0,spots:[],cr:[],cl:[],bf:[],run:false,t:0,cs:0,hint:0,fin:0,hit:0};
cam.position.set(-30,16,40);
ov('🌍 العودة إلى الأرض 3D','عدتَ من الفضاء فوجدتَ الأرض ميتة. أنت الأمل الأخير لإحيائها.','ابدأ القصة 🎬',playIntro);
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(CIN.on){cinStep(dt);audio(dt);ren.render(CIN.s,CIN.c)}else{update(dt);anim(dt);audio(dt);visuals();handAnim(dt);finalTick(dt);fx(dt);ren.render(scene,cam)}requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
